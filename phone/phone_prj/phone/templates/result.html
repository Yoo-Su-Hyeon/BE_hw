<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    {% for phone in phones %}
        <h2>"{{ keyword }}" 검색 결과 페이지 입니다.</h2>

        <h3>이름 : {{ phone.name }}</h3>
        <p>전화번호 : {{ phone.phone_num }}</p>
        <hr>
    {% empty %}
        <h3>"없는이름" 검색결과 페이지입니다.</h3>
        <p>해당 검색어와 관련된 전화번호가 없습니다.</p>
    {% endfor %}
</body>
</html>
